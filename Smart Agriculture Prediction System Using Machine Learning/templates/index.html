<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Agriculture Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
      :root {
        color-scheme: light;
        --green: #18794e;
        --deep-green: #14532d;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #f1f7f1;
        color: #1f2933;
      }

      .navbar {
        min-height: 64px;
      }

      .app-shell {
        min-height: calc(100vh - 64px);
        padding: clamp(1.25rem, 4vw, 3.5rem);
        background: radial-gradient(ellipse at top, #e2f2e5 0, #f1f7f1 60%);
      }

      .content-panel {
        width: min(100%, 1400px);
        min-height: calc(100vh - 64px - clamp(2.5rem, 8vw, 7rem));
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3.5rem);
        border: 1px solid #e2e8e2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 55px rgb(27 67 42 / 9%);
      }

      .page-title {
        margin-bottom: 0.5rem;
        color: var(--deep-green);
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        font-weight: 750;
        text-align: center;
      }

      .page-subtitle {
        margin-bottom: 2rem;
        color: #5b6b60;
        font-size: 1.05rem;
        text-align: center;
      }

      .form-label {
        margin-bottom: 0.55rem;
        color: #26372c;
        font-size: 1rem;
        font-weight: 650;
      }

      .form-control {
        min-height: 50px;
        border-color: #cfd9d1;
        border-radius: 10px;
        font-size: 1rem;
      }

      .form-control:focus {
        border-color: #4b9c70;
        box-shadow: 0 0 0 0.2rem rgb(24 121 78 / 15%);
      }

      .submit-button {
        min-height: 52px;
        padding: 0.7rem 2rem;
        border: 0;
        border-radius: 10px;
        background: var(--green);
        font-size: 1.05rem;
        font-weight: 650;
      }

      .submit-button:hover {
        background: var(--deep-green);
      }

      .recommendation-card {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
        max-width: 1100px;
        margin: 2.5rem auto 0;
        overflow: hidden;
        border: 1px solid #dce8de;
        border-radius: 18px;
        background: #f8fbf8;
        box-shadow: 0 12px 32px rgb(27 67 42 / 10%);
      }

      .recommendation-image-wrap {
        display: grid;
        min-height: 340px;
        padding: 1rem;
        place-items: center;
        background: #edf5ed;
      }

      .recommendation-image {
        display: block;
        width: 100%;
        max-height: 460px;
        object-fit: contain;
      }

      .recommendation-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(1.5rem, 4vw, 3rem);
      }

      .recommendation-eyebrow {
        margin-bottom: 0.75rem;
        color: var(--green);
        font-size: 0.9rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .recommendation-title {
        margin-bottom: 0.75rem;
        color: var(--deep-green);
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        font-weight: 750;
        line-height: 1.2;
      }

      .recommendation-description {
        margin: 0;
        color: #435348;
        font-size: clamp(1.05rem, 1.5vw, 1.25rem);
        line-height: 1.6;
      }

      @media (max-width: 767.98px) {
        .recommendation-card {
          grid-template-columns: 1fr;
        }

        .recommendation-image-wrap {
          min-height: 0;
        }

        .recommendation-image {
          max-height: 340px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-semibold" href="/">Smart Agriculture Prediction System</a>
      </div>
    </nav>

    <main class="app-shell">
      <section class="content-panel">
        <h1 class="page-title">Smart Agriculture Prediction 🌱</h1>
        <p class="page-subtitle">Enter your soil and climate details to find the best crop for your field.</p>

        <form action="/predict" method="POST">
          <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
              <label for="Nitrogen" class="form-label">Nitrogen</label>
              <input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter nitrogen level" class="form-control" required step="1">
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label for="Phosporus" class="form-label">Phosphorus</label>
              <input type="number" id="Phosporus" name="Phosporus" placeholder="Enter phosphorus level" class="form-control" required step="1">
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label for="Potassium" class="form-label">Potassium</label>
              <input type="number" id="Potassium" name="Potassium" placeholder="Enter potassium level" class="form-control" required step="1">
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label for="Temperature" class="form-label">Temperature</label>
              <input type="number" step="0.01" id="Temperature" name="Temperature" placeholder="Enter temperature in °C" class="form-control" required>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label for="Humidity" class="form-label">Humidity</label>
              <input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="Enter humidity in %" class="form-control" required>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label for="pH" class="form-label">pH</label>
              <input type="number" step="0.01" id="pH" name="pH" placeholder="Enter pH value" class="form-control" required>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label for="Rainfall" class="form-label">Rainfall</label>
              <input type="number" step="0.01" id="Rainfall" name="Rainfall" placeholder="Enter rainfall in mm" class="form-control" required>
            </div>
          </div>
          <div class="mt-4 text-center">
            <button type="submit" class="btn btn-primary submit-button">Get Recommendation</button>
          </div>
        </form>

        {% if result %}
        <section class="recommendation-card" aria-labelledby="recommendation-title">
          <div class="recommendation-image-wrap">
            <img src="{{ url_for('static', filename='crop.png') }}" class="recommendation-image" alt="Illustrated guide to the crops supported by the recommendation system">
          </div>
          <div class="recommendation-copy">
            <p class="recommendation-eyebrow">Your crop recommendation</p>
            <h2 class="recommendation-title" id="recommendation-title">{{ crop_name or "Recommendation" }}</h2>
            <p class="recommendation-description">{{ result }}</p>
          </div>
        </section>
        {% endif %}
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
